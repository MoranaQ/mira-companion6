name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate Project
        run: |
          echo "Listing repository files..."
          ls -la
          
          # العثور على ملف الـ ZIP المرفوع وفكه تلقائياً
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d extracted_project
          else
            echo "No zip found in root, searching deeper..."
            ZIP_FILE=$(find . -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -q "$ZIP_FILE" -d extracted_project
            else
              echo "Error: No ZIP file found!"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          # البحث عن مجلد المشروع الذي يحتوي على gradlew بعد الفك وبناء التطبيق
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in extracted files!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: warn
